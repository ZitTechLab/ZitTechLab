<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="120" rx="12" fill="url(#footerBg)" />

  <!-- Wave Accent -->
  <path d="M 0 60 C 300 20, 600 90, 900 40 C 1050 15, 1150 45, 1200 35 L 1200 120 L 0 120 Z" fill="url(#footerGrad)" opacity="0.25" />
  <path d="M 0 80 C 350 40, 700 100, 1000 60 C 1100 45, 1160 70, 1200 65 L 1200 120 L 0 120 Z" fill="url(#footerGrad)" opacity="0.45" />

  <!-- Accent Border Top -->
  <line x1="60" y1="1" x2="1140" y2="1" stroke="url(#footerGrad)" stroke-width="1.5" opacity="0.7" />

  <!-- Centered Footer Text -->
  <g transform="translate(600, 55)" text-anchor="middle">
    <text y="0" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-style="italic" letter-spacing="1">"Empowering Systems, Optimizing Performance."</text>
    <text y="28" fill="#6FB1FC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="2">ZỊT TECH LAB • INNOVATION &amp; RESEARCH</text>
  </g>
</svg>
