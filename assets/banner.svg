<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#001845" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#4364F7" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Grid Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="160" fill="#0052D4" opacity="0.25" filter="url(#neonGlow)" />
  <circle cx="1050" cy="180" r="180" fill="#7000FF" opacity="0.2" filter="url(#neonGlow)" />
  <circle cx="600" cy="60" r="120" fill="#00F0FF" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Cyber Wave Curves -->
  <path d="M 0 320 C 300 260, 500 360, 800 300 C 1000 260, 1100 310, 1200 290 L 1200 360 L 0 360 Z" fill="url(#primaryGrad)" opacity="0.15" />
  <path d="M 0 335 C 350 290, 650 370, 950 325 C 1080 305, 1150 330, 1200 320 L 1200 360 L 0 360 Z" fill="url(#primaryGrad)" opacity="0.35" />

  <!-- Outer Tech Border Frame -->
  <rect x="15" y="15" width="1170" height="330" rx="12" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Cyber Corner Accents -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 15 315 L 15 345 L 45 345" fill="none" stroke="#00F0FF" stroke-width="3" />
  <path d="M 1155 345 L 1185 345 L 1185 315" fill="none" stroke="#00F0FF" stroke-width="3" />

  <!-- Top Tech Meta Bar -->
  <g transform="translate(60, 42)">
    <circle cx="6" cy="6" r="5" fill="#00F0FF" filter="url(#softGlow)" />
    <text x="22" y="10" fill="#6FB1FC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">SYSTEM OPTIMIZATION &amp; SOFTWARE RESEARCH LAB</text>
    <text x="1080" y="10" text-anchor="end" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12" letter-spacing="1.5">EST. 2024 • HSAL-1.0</text>
  </g>

  <!-- Central Brand Container -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Brand Title Glow & Main Text -->
    <text y="0" fill="#00F0FF" opacity="0.3" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="6" filter="url(#neonGlow)">ZỊT TECH LAB</text>
    <text y="0" fill="#FFFFFF" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="6">ZỊT TECH LAB</text>

    <!-- Subtitle -->
    <text y="42" fill="url(#primaryGrad)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="3.5">SOFTWARE ENGINEERING &amp; WINDOWS OPTIMIZATION</text>
  </g>

  <!-- Interactive Feature Badges (Pills) -->
  <g transform="translate(600, 265)">
    <!-- Pill 1: Flagship HyperLis -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="200" height="36" rx="18" fill="url(#cardGrad)" stroke="#4364F7" stroke-width="1.2" />
      <circle cx="20" cy="18" r="4" fill="#00F0FF" />
      <text x="34" y="23" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">Flagship: HyperLis</text>
    </g>

    <!-- Pill 2: IT Support & Diagnostics -->
    <g transform="translate(-100, 0)">
      <rect x="0" y="0" width="200" height="36" rx="18" fill="url(#cardGrad)" stroke="#4364F7" stroke-width="1.2" />
      <circle cx="20" cy="18" r="4" fill="#22C55E" />
      <text x="34" y="23" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">IT Support Tools</text>
    </g>

    <!-- Pill 3: Official Site -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="200" height="36" rx="18" fill="url(#cardGrad)" stroke="#4364F7" stroke-width="1.2" />
      <circle cx="20" cy="18" r="4" fill="#EAB308" />
      <text x="34" y="23" fill="#E2E8F0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600">zittechlab.com</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="200" y1="330" x2="1000" y2="330" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>